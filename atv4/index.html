<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABELONA</title>

    <style>
        .rotina {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .rotina th,
        .rotina td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        .rotina th {
            background-color: #5d40f2;
            color: white;
        }
    </style>
</head>

<body>

<table class="rotina">
    <caption><strong>Rotina do caboco</strong></caption>

    <tr>
        <th>X</th>
        <th>Seg.</th>
        <th>Ter.</th>
        <th>Quar.</th>
        <th>Quin.</th>
        <th>Sex.</th>
        <th>Sáb.</th>
        <th>Dom.</th>
    </tr>

    <tr>
        <th>Cedin</th>
        <td colspan="5">Tomo café</td>
        <td>Durmo</td>
        <td>Durmo</td>
    </tr>

    <tr>
        <th>Horário comercial</th>
        <td colspan="5">Trabalho</td>
        <td>Grupo de pesquisa</td>
        <td>Projetos externos e descanso</td>
    </tr>

    <tr>
        <th>Tardezinha</th>
        <td>Musculação</td>
        <td>Musculação</td>
        <td>Pesquiso</td>
        <td>Musculação</td>
        <td>Pesquiso</td>
        <td>Descanso</td>
        <td>Jogar</td>
    </tr>

    <tr>
        <th>Noite</th>
        <td colspan="5">Faculdade</td>
        <td>Sair</td>
        <td>Descanso</td>
    </tr>
</table>

</body>
</html>
