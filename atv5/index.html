<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulárião</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            padding: 20px;
            background-color: rgb(114, 110, 98);
        }

        form {
            background-color: rgb(62, 4, 4);
            width: 100%;
            max-width: 500px;
            padding: 20px;
            border: 2px solid #7d0b0b;
            border-radius: 8px; 
        }

        label{
            color: antiquewhite;
        }

        legend{
            color: antiquewhite;
        }

        .bloco-campo {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .bloco-radio-checkbox {
            margin-bottom: 15px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 4px; 
        }

        input:focus, 
        textarea:focus {
            outline: 2px solid #333;
            border-color: #333;
        }

        button {
            padding: 10px 20px;
            border: 1px solid #aaa;
            border-radius: 4px;
            cursor: pointer;
            background-color: #eee;
        }

        button:hover {
            background-color: #e6acac;
        }
    </style>
</head>
<body>

    <form action="/cadastro" method="post" autocomplete="on">
        
        <fieldset>
            <legend>Dados Pessoais</legend>
            
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>

            <label for="data_nascimento">Data de nascimento:</label>
            <input type="date" id="data_nascimento" name="data_nascimento">
        </fieldset>

        <fieldset>
            <legend>Informações Acadêmicas</legend>
            
            <label for="curso">Curso:</label>
            <input type="text" id="curso" name="curso">
        </fieldset>

        <fieldset>
            <legend>Preferências</legend>

            <label>Sexo:</label>
            <input type="radio" id="masculino" name="sexo" value="masculino">
            <label for="masculino" class="inline-label">Masculino</label>
            
            <input type="radio" id="feminino" name="sexo" value="feminino">
            <label for="feminino" class="inline-label">Feminino</label>

            <label style="margin-top: 15px;">Interesses:</label>
            <input type="checkbox" id="int_tecnologia" name="interesses" value="tecnologia">
            <label for="int_tecnologia" class="inline-label">Tecnologia</label>
            
            <input type="checkbox" id="int_artes" name="interesses" value="artes">
            <label for="int_artes" class="inline-label">Artes</label>
        </fieldset>

        <fieldset>
            <legend>Informações Adicionais</legend>
            
            <label for="comentarios">Comentários:</label>
            <textarea id="comentarios" name="comentarios" rows="4"></textarea>

            <label for="foto">Upload de foto:</label>
            <input type="file" id="foto" name="foto">
        </fieldset>

        <button type="submit">Enviar</button>

    </form>

</body>
</html>
